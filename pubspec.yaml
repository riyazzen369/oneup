name: oneup
description: OneUp wellness app by StellarOne Healthcare Pvt Ltd.
publish_to: 'none'
version: 0.2.4+27

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  supabase_flutter: ^2.12.0
  flutter_secure_storage: ^9.2.2
  google_fonts: ^6.2.1
  cryptography: ^2.7.0
  url_launcher: ^6.3.0
  image_picker: ^1.1.2
  image: ^4.2.0
  flutter_displaymode: ^0.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/companion/
    - assets/content/

dependency_overrides:
  app_links: 6.3.3 # 6.4+ needs a newer Flutter Gradle plugin than 3.24.5
